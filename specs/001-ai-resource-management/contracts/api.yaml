openapi: 3.0.3
info:
  title: AI Resource Management API
  version: 1.0.0
  description: API for managing and evaluating AI resources, chats, and configurations

servers:
  - url: https://api.n8n.example.com
    description: n8n API server

paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: JWT token
              required:
                - token
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Invalid token

  /resources:
    get:
      summary: List AI resources
      parameters:
        - name: type
          in: query
          schema:
            type: string
          description: Filter by resource type
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      summary: Create AI resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Resource'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'

  /resources/{id}/items:
    get:
      summary: Get evaluation items for resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluationItem'

  /evaluations:
    post:
      summary: Save evaluation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemId:
                  type: string
                evaluated:
                  type: boolean
                notes:
                  type: string
              required:
                - itemId
                - evaluated
      responses:
        '201':
          description: Evaluation saved

  /chats:
    get:
      summary: List available chats
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'

  /chats/{id}/conversations:
    get:
      summary: Get conversations for chat
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'

  /conversations:
    post:
      summary: Create conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chatId:
                  type: string
                title:
                  type: string
              required:
                - chatId
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /conversations/{id}:
    put:
      summary: Update conversation title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required:
                - title
      responses:
        '200':
          description: Title updated
    delete:
      summary: Delete conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Conversation deleted

  /config:
    get:
      summary: Get user configuration
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
    put:
      summary: Update configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Configuration updated

components:
  schemas:
    Resource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        apiConfig:
          type: object
      required:
        - id
        - name
        - apiConfig

    EvaluationItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        evaluated:
          type: boolean
      required:
        - id
        - title
        - evaluated

    Chat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name

    Conversation:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        title:
          type: string
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
              content:
                type: string
              timestamp:
                type: string
                format: date-time
      required:
        - id
        - chatId

    Config:
      type: object
      properties:
        theme:
          type: string
          enum: [Light, Dark]
      required:
        - theme