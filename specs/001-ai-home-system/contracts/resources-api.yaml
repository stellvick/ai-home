openapi: 3.0.3
info:
  title: AI Home Resources API
  version: 1.0.0
  description: Manage AI resources and their configurations

servers:
  - url: https://n8n.stellvick.fun/webhook
    description: n8n resources webhook

paths:
  /resources:
    get:
      summary: List user resources
      description: Get all AI resources for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
        '401':
          description: Unauthorized
        '500':
          description: Server error

    post:
      summary: Create new resource
      description: Register a new AI resource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: Invalid input
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /resources/{resourceId}:
    get:
      summary: Get resource details
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
        '401':
          description: Unauthorized

    put:
      summary: Update resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          description: Resource updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
        '401':
          description: Unauthorized

    delete:
      summary: Delete resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema:
            type: string
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Resource deleted
        '404':
          description: Resource not found
        '401':
          description: Unauthorized

components:
  schemas:
    Resource:
      type: object
      required:
        - id
        - name
        - api_url
      properties:
        id:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 100
        api_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResourceInput:
      type: object
      required:
        - name
        - api_url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        api_url:
          type: string
          format: uri

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT