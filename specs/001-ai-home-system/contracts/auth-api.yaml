openapi: 3.0.3
info:
  title: AI Home Authentication API
  version: 1.0.0
  description: JWT authentication for AI Home system

servers:
  - url: https://n8n.stellvick.fun/webhook/962701ed-f87d-4ec1-b965-ae74259d0041
    description: n8n authentication webhook

paths:
  /:
    post:
      summary: Authenticate user and obtain JWT
      description: Authenticate with username/password and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 50
                  description: User login username
                password:
                  type: string
                  minLength: 8
                  description: User password
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - jwt
                  - user
                properties:
                  jwt:
                    type: string
                    description: JWT token for API access
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid credentials"
        '429':
          description: Too many requests
        '500':
          description: Server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT