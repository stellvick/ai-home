openapi: 3.0.3
info:
  title: AI Oracle Platform API
  description: Backend API for mystical AI evaluation platform with secure authentication, multi-modal assessment, and chat functionality
  version: 1.0.0
  contact:
    name: AI Oracle Platform
    url: https://ai-oracle.example.com

servers:
  - url: http://localhost:3001/api/v1
    description: Development server
  - url: https://api.ai-oracle.example.com/v1
    description: Production server

security:
  - BearerAuth: []

paths:
  # Authentication Endpoints
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login with credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: oracle@example.com
                password:
                  type: string
                  minLength: 8
                  example: mysticalPassword123
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    $ref: '#/components/schemas/User'
                  expiresAt:
                    type: string
                    format: date-time
        401:
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current session
      responses:
        200:
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh JWT token
      responses:
        200:
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time

  /auth/sessions:
    get:
      tags: [Authentication]
      summary: Get active user sessions
      responses:
        200:
          description: List of active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthSession'

  /auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      summary: Terminate specific session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Session terminated

  # User Management Endpoints
  /users/profile:
    get:
      tags: [User Management]
      summary: Get current user profile
      responses:
        200:
          description: User profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    put:
      tags: [User Management]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        200:
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/preferences:
    get:
      tags: [User Management]
      summary: Get user preferences
      responses:
        200:
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'

    put:
      tags: [User Management]
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        200:
          description: Preferences updated

  # Evaluation Endpoints
  /evaluations:
    get:
      tags: [Evaluation]
      summary: Get user's evaluation history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [prompt, response, image, document, conversation]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, analyzing, reviewing, completed, failed]
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        200:
          description: Evaluation list with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  evaluations:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationResource'
                  pagination:
                    $ref: '#/components/schemas/PaginationInfo'

    post:
      tags: [Evaluation]
      summary: Submit content for evaluation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, type]
              properties:
                title:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                type:
                  type: string
                  enum: [prompt, response, image, document, conversation]
                content:
                  type: string
                  description: Text content for text-based evaluations
                file:
                  type: string
                  format: binary
                  description: File upload for binary content (max 100MB)
                tags:
                  type: array
                  items:
                    type: string
                    maxLength: 50
                  maxItems: 10
      responses:
        201:
          description: Evaluation submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResource'
        400:
          description: Invalid request data
        413:
          description: File too large (>100MB)

  /evaluations/{evaluationId}:
    get:
      tags: [Evaluation]
      summary: Get specific evaluation details
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Evaluation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResource'
        404:
          description: Evaluation not found

    delete:
      tags: [Evaluation]
      summary: Delete evaluation
      parameters:
        - name: evaluationId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Evaluation deleted

  # Chat Endpoints
  /chat/sessions:
    get:
      tags: [Chat]
      summary: Get user's chat sessions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, idle, archived]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        200:
          description: Chat sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSession'

    post:
      tags: [Chat]
      summary: Create new chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                avatar:
                  type: string
                  enum: [lunar-sage, shadow-seer, crystal-guardian, mystic-oracle]
                settings:
                  $ref: '#/components/schemas/SessionSettings'
      responses:
        201:
          description: Chat session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'

  /chat/sessions/{sessionId}:
    get:
      tags: [Chat]
      summary: Get specific chat session with messages
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Chat session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'

    put:
      tags: [Chat]
      summary: Update chat session settings
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionUpdate'
      responses:
        200:
          description: Session updated

    delete:
      tags: [Chat]
      summary: Archive chat session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Session archived

  /chat/sessions/{sessionId}/messages:
    post:
      tags: [Chat]
      summary: Send message to chat session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  maxLength: 10000
                type:
                  type: string
                  enum: [user, system]
                  default: user
      responses:
        201:
          description: Message sent, AI response included
          content:
            application/json:
              schema:
                type: object
                properties:
                  userMessage:
                    $ref: '#/components/schemas/ChatMessage'
                  assistantMessage:
                    $ref: '#/components/schemas/ChatMessage'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        avatar:
          type: string
          nullable: true
        biography:
          type: string
          nullable: true
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        isActive:
          type: boolean

    UserProfileUpdate:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        avatar:
          type: string
          nullable: true
        biography:
          type: string
          maxLength: 500
          nullable: true

    UserPreferences:
      type: object
      properties:
        theme:
          type: string
          enum: [lunar, shadow]
        notifications:
          $ref: '#/components/schemas/NotificationSettings'
        chatSettings:
          $ref: '#/components/schemas/ChatSettings'
        language:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true

    NotificationSettings:
      type: object
      properties:
        evaluationComplete:
          type: boolean
        chatMentions:
          type: boolean
        securityAlerts:
          type: boolean
        pushoverEnabled:
          type: boolean

    ChatSettings:
      type: object
      properties:
        aiPersonality:
          type: string
          enum: [mystical, professional, casual]
        aiTone:
          type: string
          enum: [formal, friendly, enigmatic]
        historyEnabled:
          type: boolean
        contextLength:
          type: integer
          minimum: 1
          maximum: 50

    AuthSession:
      type: object
      properties:
        id:
          type: string
        deviceInfo:
          $ref: '#/components/schemas/DeviceInfo'
        createdAt:
          type: string
          format: date-time
        lastAccessAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string
        isActive:
          type: boolean

    DeviceInfo:
      type: object
      properties:
        type:
          type: string
          enum: [desktop, mobile, tablet, unknown]
        browser:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
        isTrusted:
          type: boolean

    EvaluationResource:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [prompt, response, image, document, conversation]
        content:
          $ref: '#/components/schemas/ResourceContent'
        evaluation:
          $ref: '#/components/schemas/EvaluationResult'
          nullable: true
        metadata:
          $ref: '#/components/schemas/ResourceMetadata'
        status:
          type: string
          enum: [pending, analyzing, reviewing, completed, failed]
        createdAt:
          type: string
          format: date-time
        evaluatedAt:
          type: string
          format: date-time
          nullable: true
        tags:
          type: array
          items:
            type: string

    ResourceContent:
      type: object
      properties:
        text:
          type: string
          nullable: true
        fileUrl:
          type: string
          nullable: true
        fileName:
          type: string
          nullable: true
        fileSize:
          type: integer
          nullable: true
        mimeType:
          type: string
          nullable: true

    EvaluationResult:
      type: object
      properties:
        overallScore:
          type: integer
          minimum: 0
          maximum: 100
        aiAnalysis:
          $ref: '#/components/schemas/AIAnalysis'
        humanReview:
          $ref: '#/components/schemas/HumanReview'
          nullable: true
        runeRating:
          type: string
          enum: [legendary, masterful, skilled, apprentice, novice]
        recommendations:
          type: array
          items:
            type: string

    AIAnalysis:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        criteria:
          $ref: '#/components/schemas/AnalysisCriteria'
        processingTime:
          type: number

    HumanReview:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        reviewer:
          type: string
        comments:
          type: string
        reviewedAt:
          type: string
          format: date-time

    AnalysisCriteria:
      type: object
      properties:
        clarity:
          type: integer
          minimum: 0
          maximum: 100
        effectiveness:
          type: integer
          minimum: 0
          maximum: 100
        creativity:
          type: integer
          minimum: 0
          maximum: 100
        technicalQuality:
          type: integer
          minimum: 0
          maximum: 100

    ResourceMetadata:
      type: object
      properties:
        originalSize:
          type: integer
          nullable: true
        dimensions:
          type: object
          nullable: true
          properties:
            width:
              type: integer
            height:
              type: integer
        duration:
          type: number
          nullable: true
        checksum:
          type: string
          nullable: true

    ChatSession:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        avatar:
          type: string
          enum: [lunar-sage, shadow-seer, crystal-guardian, mystic-oracle]
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        context:
          $ref: '#/components/schemas/ConversationContext'
        settings:
          $ref: '#/components/schemas/SessionSettings'
        status:
          type: string
          enum: [active, idle, archived, error]
        createdAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        isArchived:
          type: boolean

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        type:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          $ref: '#/components/schemas/MessageMetadata'
          nullable: true

    MessageMetadata:
      type: object
      properties:
        tokens:
          type: integer
          nullable: true
        processingTime:
          type: number
          nullable: true
        modelUsed:
          type: string
          nullable: true
        confidence:
          type: number
          nullable: true

    ConversationContext:
      type: object
      properties:
        personality:
          type: string
        tone:
          type: string
        systemPrompt:
          type: string
        customInstructions:
          type: string
          nullable: true

    SessionSettings:
      type: object
      properties:
        maxMessages:
          type: integer
          minimum: 1
          maximum: 100
        autoTitle:
          type: boolean
        saveHistory:
          type: boolean
        temperature:
          type: number
          minimum: 0
          maximum: 1

    SessionUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        settings:
          $ref: '#/components/schemas/SessionSettings'
        status:
          type: string
          enum: [active, idle, archived]

    PaginationInfo:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
        timestamp:
          type: string
          format: date-time

  responses:
    Unauthorized:
      description: Authentication required or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: Invalid or expired token
            code: AUTH_TOKEN_INVALID
            timestamp: "2025-11-05T10:30:00Z"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'