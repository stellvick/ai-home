openapi: 3.0.3
info:
  title: AI Resource Evaluation API
  version: 1.0.0
  description: API for managing and evaluating AI resources

servers:
  - url: http://localhost:3000/api
    description: Development server

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /resources:
    get:
      summary: Get all resources with filters
      parameters:
        - name: evaluated
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Resource'
    post:
      summary: Create new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'

  /resources/{id}/evaluate:
    post:
      summary: Evaluate a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationInput'
      responses:
        '200':
          description: Evaluation saved

  /chats:
    get:
      summary: Get all chats
      responses:
        '200':
          description: List of chats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chat'
    post:
      summary: Create new chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInput'
      responses:
        '201':
          description: Chat created

  /chats/{chatId}/conversations:
    get:
      summary: Get conversations for a chat
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      summary: Create new conversation
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationInput'
      responses:
        '201':
          description: Conversation created

  /conversations/{id}:
    put:
      summary: Update conversation title
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '200':
          description: Title updated
    delete:
      summary: Delete conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Conversation deleted

  /config:
    get:
      summary: Get user configuration
      responses:
        '200':
          description: User config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
    put:
      summary: Update user configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Config'
      responses:
        '200':
          description: Config updated

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Resource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        api_endpoint:
          type: string
        evaluated:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResourceInput:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        api_endpoint:
          type: string
      required:
        - title
        - api_endpoint

    EvaluationInput:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comments:
          type: string

    Chat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    ChatInput:
      type: object
      properties:
        name:
          type: string
      required:
        - name

    Conversation:
      type: object
      properties:
        id:
          type: string
        chat_id:
          type: string
        title:
          type: string
        messages:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationInput:
      type: object
      properties:
        title:
          type: string
        messages:
          type: array
          items:
            type: object
      required:
        - messages

    Config:
      type: object
      properties:
        theme:
          type: string
          enum: [light, dark]